<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex,nofollow">
    <title>나의 소망생물 — 소망경매장</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: #dfe9e4; font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
      main { min-height: 100svh; max-width: 560px; margin: 0 auto; padding: 28px 20px 40px; display: flex; flex-direction: column; }
      .kicker { font: 10px/1.6 ui-monospace, monospace; letter-spacing: .14em; color: #7f9da2; margin: 0; }
      figure { margin: 22px 0 0; border: 1px solid rgba(220,235,230,.18); border-radius: 50% 50% 18px 18px / 36% 36% 18px 18px; overflow: hidden; background: #000; }
      figure img { display: block; width: 100%; height: auto; -webkit-touch-callout: default; }
      h1 { font-size: 28px; font-weight: 600; margin: 24px 0 4px; letter-spacing: -.01em; }
      .latin { font-style: italic; color: #9db8b6; margin: 0; font-size: 15px; }
      .wish { margin: 18px 0 0; font-size: 15px; line-height: 1.7; color: #c3d6d0; }
      .save { margin-top: 26px; display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 22px; border-radius: 999px; background: #e3eee6; color: #12302f; font-size: 16px; font-weight: 600; text-decoration: none; }
      .tip { font-size: 12px; color: #86a3a6; line-height: 1.7; margin: 14px 4px 0; }
      .id { margin-top: auto; padding-top: 28px; font: 10px ui-monospace, monospace; color: #5e7c80; letter-spacing: .08em; }
      .missing { margin-top: 30vh; text-align: center; color: #9db8b6; }
    </style>
  </head>
  <body>
    <main id="page">
      <p class="kicker">WISH AUCTION HOUSE · MY WISH CREATURE</p>
      <!--CREATURE-->
    </main>
  </body>
</html>
